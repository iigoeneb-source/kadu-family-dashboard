*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--paper);color:var(--deep);font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.card{background:#fff;border:1px solid rgba(23,63,60,.15);border-radius:16px;box-shadow:0 8px 24px rgba(23,63,60,.08);max-width:400px;width:100%;padding:32px 28px;text-align:center;}
h1{font-size:20px;margin-bottom:6px;}
.sub{font-size:13px;color:rgba(23,63,60,.65);margin-bottom:22px;}
input[type=password]{width:100%;padding:12px 14px;font-size:16px;border:1.5px solid rgba(23,63,60,.25);border-radius:10px;background:var(--paper);color:var(--deep);}
input[type=password]:focus{outline:2px solid var(--accent);border-color:var(--accent);}
button{width:100%;margin-top:14px;padding:12px;font-size:16px;font-weight:700;border:none;border-radius:10px;background:var(--deep);color:#fff;cursor:pointer;}
button:hover{opacity:.9;}
button:disabled{opacity:.5;cursor:wait;}
label.remember{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;font-size:13px;color:rgba(23,63,60,.75);cursor:pointer;}
.error{display:none;margin-top:12px;font-size:13px;color:#a33;background:rgba(170,51,51,.08);border-radius:8px;padding:8px;}
.status{display:none;margin-top:12px;font-size:13px;color:rgba(23,63,60,.65);}
</style>
</head>
<body>
<div class="card" id="gate">
  <h1>🏠 かづ家ダッシュボード</h1>
  <p class="sub">合言葉を入れてね</p>
  <input type="password" id="pw" autocomplete="current-password" aria-label="合言葉">
  <button id="open">開く</button>
  <label class="remember"><input type="checkbox" id="remember">このデバイスで記憶</label>
  <p class="error" id="err">合言葉が違うみたい。もう一度ためしてね</p>
  <p class="status" id="st">確認中…</p>
</div>

var ITER=600000;
var LS_KEY="fd_key_v1";

function hexToBytes(h){var a=new Uint8Array(h.length/2);for(var i=0;i<a.length;i++){a[i]=parseInt(h.substr(i*2,2),16);}return a;}
function b64ToBytes(b){var s=atob(b);var a=new Uint8Array(s.length);for(var i=0;i<s.length;i++){a[i]=s.charCodeAt(i);}return a;}
function bytesToB64(buf){var a=new Uint8Array(buf);var s="";for(var i=0;i<a.length;i++){s+=String.fromCharCode(a[i]);}return btoa(s);}

var salt=hexToBytes(SALT_HEX);
var nonce=hexToBytes(NONCE_HEX);
var ct=b64ToBytes(CT_B64);

function deriveKey(pw){
  var enc=new TextEncoder();
  return crypto.subtle.importKey("raw",enc.encode(pw),"PBKDF2",false,["deriveKey"]).then(function(km){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:salt,iterations:ITER,hash:"SHA-256"},km,{name:"AES-GCM",length:256},true,["decrypt"]);
  });
}
function decryptWith(key){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:nonce},key,ct).then(function(buf){
    return new TextDecoder().decode(buf);
  });
}
function show(html){
  // document.write は復号後にviewport/文字サイズがモバイルで崩れるため使わない。
  // 親ページのviewportを維持したまま、全画面iframe(srcdoc)で完全なHTMLとして描画する。
  var frame = document.createElement('iframe');
  frame.setAttribute('title', 'かづ家ダッシュボード');
  frame.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:none;background:#f5f1e8;';
  frame.srcdoc = html;
  document.body.innerHTML = '';
  document.body.style.margin = '0';
  document.body.style.padding = '0';
  document.body.style.overflow = 'hidden';
  document.body.appendChild(frame);
}
function rememberKey(key){
  return crypto.subtle.exportKey("raw",key).then(function(raw){
    try{localStorage.setItem(LS_KEY,bytesToB64(raw));}catch(e){}
  });
}
function loadRememberedKey(){
  var b64;
  try{b64=localStorage.getItem(LS_KEY);}catch(e){return Promise.resolve(null);}
  if(!b64){return Promise.resolve(null);}
  return crypto.subtle.importKey("raw",b64ToBytes(b64),{name:"AES-GCM"},false,["decrypt"]).catch(function(){return null;});
}
function clearRemembered(){try{localStorage.removeItem(LS_KEY);}catch(e){}}

var pwInput=document.getElementById("pw");
var openBtn=document.getElementById("open");
var rememberBox=document.getElementById("remember");
var errEl=document.getElementById("err");
var stEl=document.getElementById("st");

function setBusy(b){openBtn.disabled=b;stEl.style.display=b?"block":"none";}

function tryPassword(){
  var pw=pwInput.value;
  if(!pw){pwInput.focus();return;}
  errEl.style.display="none";
  setBusy(true);
  deriveKey(pw).then(function(key){
    return decryptWith(key).then(function(html){
      var after=rememberBox.checked?rememberKey(key):Promise.resolve();
      return after.then(function(){show(html);});
    });
  }).catch(function(){
    setBusy(false);
    errEl.style.display="block";
    pwInput.select();
  });
}

openBtn.addEventListener("click",tryPassword);
pwInput.addEventListener("keydown",function(e){if(e.key==="Enter"){tryPassword();}});

// 保存済みの鍵があれば自動で開く（失敗したら消して入力UIへ）
setBusy(true);
loadRememberedKey().then(function(key){
  if(!key){setBusy(false);pwInput.focus();return;}
  return decryptWith(key).then(function(html){show(html);}).catch(function(){
    clearRemembered();
    setBusy(false);
    pwInput.focus();
  });
}).catch(function(){setBusy(false);pwInput.focus();});
})();
</script>
